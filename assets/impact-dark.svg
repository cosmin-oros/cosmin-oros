<svg xmlns="http://www.w3.org/2000/svg" width="840" height="128" viewBox="0 0 840 128" role="img" aria-label="5 products in production built end to end at GAIM, 25+ portals served from one codebase, 3 platforms shipped: web, iOS and Android, 4 LLM providers behind one interface">
<title>5 products in production built end to end at GAIM, 25+ portals served from one codebase, 3 platforms shipped: web, iOS and Android, 4 LLM providers behind one interface</title>
<style>
