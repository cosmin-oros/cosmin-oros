<svg xmlns="http://www.w3.org/2000/svg" width="840" height="290" viewBox="0 0 840 290" role="img" aria-label="Cosmin Oros, full-stack product engineer. I build products that ship: web, mobile, backend and the AI inside them, from first commit to paying customers.">
<title>Cosmin Oros, full-stack product engineer. I build products that ship: web, mobile, backend and the AI inside them, from first commit to paying customers.</title>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  
  @keyframes up { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .up { animation: up .7s cubic-bezier(.2,.8,.2,1) both; }
  .fade { animation: fade .8s ease-out both; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

  
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .sig { stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .9s cubic-bezier(.4,0,.6,1) 1.3s forwards; }
  @media (prefers-reduced-motion: reduce) { .sig { stroke-dashoffset: 0; } }
</style>

